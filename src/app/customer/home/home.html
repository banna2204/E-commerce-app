<div class="home-page p-10">
    <div class="promotional-banner"></div>
    <div class="flex flex-col gap-3">
        <div class="f-s-18 fw-7">Top Categories</div>
        <div class="category-item-container flex gap-10 mt-5 justify-center">
            @for(category of categories(); track category.id) {
                <div class="category-item-content flex-col">
                    <div>
                        <img width="100" height="80" [src]="category.image" alt="category image">
                    </div>
                    <div class="f-s-12">{{category.name}}</div>
                </div>
            }
            <div class="all-category fw-5" [routerLink]="['/customer/categories']">View All Categories</div>
        </div>

        <div class="f-s-18 fw-7">Top Products</div>
        <div class="product-item-container flex gap-10 mt-5 justify-center">
            @for(product of products(); track product.id) {
                <div class="product-item-content flex flex-col">
                    <div>
                        <img width="100" height="80" [src]="product.image" alt="product image">
                    </div>
                    <div class="product-title f-s-12">{{product.title}}</div>
                </div>
            }
            <div class="all-products fw-5" [routerLink]="['/customer/products']">View All Products</div>
        </div>
    </div>
</div>
