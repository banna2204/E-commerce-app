<div class="flex flex-col item-center justify-center mb-10">
    <div class="cover-image flex item-center mt-30">
        <div class="flex flex-col gap-3 pl-20">
            <div class="cover-image-text">Explore our</div>
            <div class="f-s-40 my-10 fw-7">Products</div>
            <div class="cover-image-text">Discover top categories and find what you love</div>
        </div>
    </div>

    <div class="product-item-content br-5 flex-col p-6 mt-10">
        <div>
            <img class="br-5" width="400" height="230" [src]="product()?.image" alt="category image">
        </div>
        <div class="f-s-14 fw-5">{{product()?.title}}</div>
        <div class="f-s-14 fw-5">Price: {{product()?.price}}</div>
        <div class="flex justify-between">
            <div>
                <div>Rating: {{product()?.rating}}</div>
                <div>Stock: {{product()?.stock}}</div>
            </div>
            <button matButton (click)="addToCart()">Add to Cart</button>
        </div>
    </div>
</div>
