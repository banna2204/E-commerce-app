<div class="flex flex-col item-center justify-center mb-10">
    <div class="cover-image flex item-center mt-30">
        <div class="flex flex-col gap-3 pl-20">
            <div class="f-s-40 my-10 fw-7">All Orders</div>
        </div>
    </div>
    <div class="product-item-container flex flex-col gap-10 justify-center my-10">
        @for(product of orders(); track product.id) {
        <div class="product-item-content flex br-5 p-6 gap-5">
            <img class="br-5" width="100" height="70" [src]="product.image" alt="products image">
            <div class="flex flex-col w-full">
                <div class="flex justify-between">
                    <div class="f-s-14 fw-5">{{product.title}}</div>
                    <div class="f-s-14 fw-5">Price: {{product.price}}</div>
                </div>
                <div class="flex justify-between">
                    <div>
                        <div>Rating: {{product.rating}}</div>
                        <div>Stock: {{product.stock}}</div>
                    </div>
                    <div class="mt-2 f-s-12">Quantity: {{product.quantity}}</div>
                </div>
            </div>
        </div>
        }
    </div>

    @if(orders().length == 0) {
        <div class="empty-state f-s-16 mt-20">No Carts.</div>
    }
</div>
