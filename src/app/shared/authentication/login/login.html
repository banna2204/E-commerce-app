<div class="flex gap-10 login-section">
    <div class="left-section flex item-center justify-center">
        <img width="700px" height="685px" src="/lock2.png" alt="lock image">
    </div>
    <div class="right-section flex flex-col item-center justify-center w-55 gap-12">
        <div class="f-s-24 fw-7">Welcome Back!!</div>
        <form [formGroup]="authGroup" (ngSubmit)="onSubmit()" class="flex flex-col gap-10">
            <mat-form-field>
                <input matInput placeholder="Enter Email" required formControlName="email"/>
            </mat-form-field>
            <mat-form-field>
                <input matInput placeholder="Enter Password" required formControlName="password"/>
                <button
                    matIconButton
                    matSuffix
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide()"
                >
                <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            <button matButton type="submit" [disabled]="authGroup.invalid">Login</button>
            <div [routerLink]="['/forget-password']" class="forget-password">Forget Password</div>
            <div [routerLink]="['/registration']" class="dontHaveAccount fw-5">Don't have an account? <span>Sign Up</span></div>
        </form>
    </div>
</div>
