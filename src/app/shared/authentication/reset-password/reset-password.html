<div class="flex gap-10 reset-Pass-section">
    <div class="left-section flex item-center justify-center">
        <img width="700px" height="685px" src="/lock2.png" alt="lock image">
    </div>
    <div class="right-section flex flex-col item-center justify-center w-55 gap-12">
        <div class="f-s-24 fw-7">Reset Password!!</div>
        <form [formGroup]="authGroup" (ngSubmit)="onSubmit()" class="flex flex-col gap-10">
            <mat-form-field>
                <input matInput placeholder="New Password" required formControlName="newPassword"/>
                <button
                    matIconButton
                    matSuffix
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide()"
                >
                <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            <mat-form-field>
                <input matInput placeholder="Confirm Password" required formControlName="confirmPassword"/>
                <button
                    matIconButton
                    matSuffix
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide()"
                >
                <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            <button matButton type="submit" [disabled]="authGroup.invalid">Reset</button>
        </form>
    </div>
</div>
