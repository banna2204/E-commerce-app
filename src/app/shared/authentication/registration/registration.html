<div class="flex gap-10 registration-section">
    <div class="left-section flex item-center justify-center">
        <img width="700px" height="685px" src="/lock2.png" alt="lock image">
    </div>
    <div class="right-section flex flex-col item-center justify-center w-55 gap-12">
        <div class="f-s-24 fw-7">Create Account!!</div>
        <form [formGroup]="authGroup" (ngSubmit)="onSubmit()" class="flex flex-col gap-10">
            <mat-form-field>
                <input matInput placeholder="Enter Name" required formControlName="name"/>
            </mat-form-field>
            <mat-form-field>
                <input matInput placeholder="Enter Email" required formControlName="email"/>
            </mat-form-field>
            <mat-form-field>
                <input matInput placeholder="Enter phone" required formControlName="phone"/>
            </mat-form-field>
            <mat-form-field>
                <input matInput placeholder="Enter Password" required formControlName="password"/>
                <button
                    matIconButton
                    matSuffix
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide()"
                >
                <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            <button matButton type="submit" [disabled]="authGroup.invalid">Register</button>
            <div [routerLink]="['/login']" class="alreadyHaveAccount fw-5">Already have an account? <span>Login</span></div>
        </form>
    </div>
</div>
